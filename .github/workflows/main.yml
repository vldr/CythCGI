name: Build
 
on:
  push:
    branches: [master]

jobs:
  build:
    name: Build
    concurrency: ci-${{ github.ref }}
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: |
          cargo build --release

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: cyth-cgi
          path: target/release/cyth-cgi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
