[package]
name = "cyth-cgi"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
dashmap = "6.1.0"
regex = "1.11.1"
sqlite = { path = "vendor/sqlite" }
fastcgi = { path = "vendor/fastcgi" }
bcrypt = "0.17.0"
uuid = { version = "1.18.0", features = ["v4"] }
markdown = "1.0.0"
percent-encoding = "2.3.1"
v8 = "139.0.0"

[profile.release]
lto = "fat"
codegen-units = 1
